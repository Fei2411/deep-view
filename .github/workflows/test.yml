name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }} · DSH ${{ matrix.dsh }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24, dsh: 0.2.1-rc.2 }
          - { os: windows-latest, node: 24, dsh: 0.2.1-rc.2 }
          - { os: ubuntu-latest, node: 22, dsh: 0.2.1-rc.2 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Pin the DSH version under test
        run: |
          npm pkg set --prefix dev/harness "devDependencies.@deepseek-ai/dsh=${{ matrix.dsh }}"
          npm pkg set --prefix dev/harness "dependencies.@deepseek-ai/dsh=${{ matrix.dsh }}"
      - run: npm ci
      - run: npm run harness
      - run: node scripts/build-client.mjs --check
      - run: node --import ./test/harness-resolve.mjs --test --test-timeout=120000 "test/*.test.js"
      - run: npm run lint
      - run: node scripts/scan.mjs
